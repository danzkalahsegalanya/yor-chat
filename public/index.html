<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yor Chat</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="container">
        <div class="logo-wrap">
            <div class="logo-icon">
                <img src="/yor.png" alt="Yor" onerror="this.style.display='none'; this.parentElement.innerHTML='🌸';">
            </div>
        </div>
        <h1>YOR CHAT</h1>
        <p class="subtitle">Chat privat — cuma yang tau nomor lo yang bisa chat</p>

        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p>Cek login...</p>
        </div>

        <div id="buttons" style="display:none;">
            <a href="/login.html" class="btn btn-primary">Login</a>
            <a href="/register.html" class="btn btn-secondary">Register</a>
        </div>
    </div>

    <script src="/supabase.js"></script>
    <script>
        window.addEventListener('supabase-ready', async () => {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('buttons').style.display = 'block';

            const { data: { session } } = await window.supabaseClient.auth.getSession();
            if (session) {
                window.location.href = '/chat.html';
            }
        });
    </script>
</body>
</html>
