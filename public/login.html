<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Yor Chat</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="container">
        <div class="logo-wrap">
            <div class="logo-icon">
                <img src="/yor.png" alt="Yor" onerror="this.style.display='none'; this.parentElement.innerHTML='🌸';">
            </div>
        </div>
        <h1>LOGIN</h1>
        <p class="subtitle">Masuk ke akun lo</p>

        <form id="loginForm">
            <input type="email" id="email" placeholder="Email" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit" class="btn btn-primary">Login</button>
        </form>

        <div id="error" class="error"></div>

        <p class="footer-link">
            Belum punya akun? <a href="/register.html">Register</a>
        </p>
    </div>

    <script src="/supabase.js"></script>
    <script>
        window.addEventListener('supabase-ready', () => {
            const form = document.getElementById('loginForm');
            const error = document.getElementById('error');

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;

                const { data, error: err } = await window.supabase.auth.signInWithPassword({
                    email, password
                });

                if (err) {
                    error.textContent = err.message;
                    error.classList.add('show');
                    return;
                }

                window.location.href = '/chat.html';
            });
        });
    </script>
</body>
</html>
