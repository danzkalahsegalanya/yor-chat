<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate, max-age=0">
    <title>Chat - Yor Chat</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body class="chat-page">
    <div class="chat-container">
        <div class="sidebar">
            <div class="sidebar-header">
                <div class="user-info" id="userProfileBtn" style="cursor:pointer;">
                    <div class="user-avatar" id="myAvatar">🌸</div>
                    <div>
                        <div class="user-name" id="myUsername">Loading...</div>
                        <div class="user-phone" id="myPhone">-</div>
                    </div>
                </div>
                <button id="logoutBtn" class="logout-btn">Logout</button>
            </div>

            <div class="my-number-box">
                <div>
                    <div class="my-number-label">📱 Nomor Saya</div>
                    <div class="my-number" id="myNumber">-</div>
                </div>
                <button class="copy-number-btn" id="copyNumberBtn">Copy</button>
            </div>

            <button class="new-chat-btn" id="newChatBtn">+ Chat Baru</button>

            <div class="user-list" id="userList">
                <div class="loading-small">Loading chats...</div>
            </div>
        </div>

        <div class="chat-area">
            <div id="emptyChat" class="empty-chat">
                <div class="empty-icon">💬</div>
                <p>Pilih chat atau mulai chat baru</p>
                <p class="empty-hint">Cuma yang tau nomor lo yang bisa chat</p>
            </div>

            <div id="chatRoom" style="display:none;">
                <div class="chat-header">
                    <button class="back-btn" id="backBtn">←</button>
                    <div class="chat-avatar-wrap">
                        <div class="chat-avatar" id="chatAvatar">🌸</div>
                        <span class="online-dot" id="chatOnlineDot"></span>
                    </div>
                    <div style="flex:1;">
                        <div class="chat-username" id="chatUsername">-</div>
                        <div class="chat-phone-small" id="chatStatus">-</div>
                    </div>
                </div>

                <div class="messages" id="messages"></div>

                <div class="typing-indicator" id="typingIndicator" style="display:none;">
                    <span></span><span></span><span></span> Lagi ngetik...
                </div>

                <div class="chat-input-area">
                    <input type="text" id="messageInput" placeholder="Ketik pesan...">
                    <button id="sendBtn">Kirim</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal" id="newChatModal">
        <div class="modal-box">
            <h3>Chat Baru</h3>
            <p class="modal-desc">Masukin nomor tujuan (12 digit, contoh: 081234567890)</p>
            <input type="text" id="searchNumber" placeholder="08xxxxxxxxxx" maxlength="12">
            <div id="searchError" class="error"></div>
            <div class="modal-buttons">
                <button class="btn btn-secondary" id="cancelNewChat">Batal</button>
                <button class="btn btn-primary" id="startChat">Mulai Chat</button>
            </div>
        </div>
    </div>

    <script src="/supabase.js"></script>
    <script>
        let supabase = null;
        let currentUser = null;
        let currentProfile = null;
        let currentChatUser = null;
        let messagesSubscription = null;
        let globalMessagesSubscription = null;
        let presenceChannel = null;
        let typingChannel = null;
        let onlineCheckInterval = null;
        let chatListRefreshTimeout = null;
        let typingTimeout = null;
        let isTyping = false;

        window.addEventListener('supabase-ready', async () => {
            supabase = window.supabaseClient;

            const { data: { session } } = await supabase.auth.getSession();
            if (!session) {
                window.location.href = '/login.html';
                return;
            }

            currentUser = session.user;
            await loadMyProfile();
            await loadChatList();
            setupPresence();
            setupGlobalMessagesListener();

            if ('Notification' in window && Notification.permission === 'default') {
                Notification.requestPermission();
            }

            document.getElementById('logoutBtn').addEventListener('click', async () => {
                if (presenceChannel) presenceChannel.unsubscribe();
                if (globalMessagesSubscription) globalMessagesSubscription.unsubscribe();
                await supabase.auth.signOut();
                window.location.href = '/';
            });

            document.getElementById('userProfileBtn').addEventListener('click', () => {
                window.location.href = '/profile.html';
            });

            document.getElementById('copyNumberBtn').addEventListener('click', () => {
                if (currentProfile && currentProfile.phone_number) {
                    navigator.clipboard.writeText(currentProfile.phone_number);
                    showNotification('Nomor berhasil di-copy!');
                }
            });

            document.getElementById('newChatBtn').addEventListener('click', () => {
                document.getElementById('newChatModal').style.display = 'flex';
                document.getElementById('searchNumber').focus();
            });

            document.getElementById('cancelNewChat').addEventListener('click', () => {
                document.getElementById('newChatModal').style.display = 'none';
                document.getElementById('searchNumber').value = '';
                document.getElementById('searchError').classList.remove('show');
            });

            document.getElementById('startChat').addEventListener('click', startNewChat);
            document.getElementById('searchNumber').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') startNewChat();
            });

            document.getElementById('sendBtn').addEventListener('click', sendMessage);
            document.getElementById('messageInput').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') sendMessage();
            });

            document.getElementById('messageInput').addEventListener('input', () => {
                if (!currentChatUser || !typingChannel) return;
                if (!isTyping) {
                    isTyping = true;
                    typingChannel.send({
                        type: 'broadcast',
                        event: 'typing',
                        payload: { from: currentUser.id, to: currentChatUser.id }
                    });
                }
                clearTimeout(typingTimeout);
                typingTimeout = setTimeout(() => { isTyping = false; }, 2000);
            });

            document.getElementById('backBtn').addEventListener('click', closeChat);
        });

        function setupGlobalMessagesListener() {
            globalMessagesSubscription = supabase
                .channel('global-messages')
                .on('postgres_changes', {
                    event: 'INSERT',
                    schema: 'public',
                    table: 'messages',
                    filter: `receiver_id=eq.${currentUser.id}`
                }, (payload) => {
                    const msg = payload.new;
                    if (currentChatUser && msg.sender_id === currentChatUser.id) {
                        appendMessage(msg);
                        markAsRead().then(() => loadChatList());
                    } else {
                        debouncedLoadChatList();
                        loadSenderNameAndNotify(msg.sender_id, msg.content);
                    }
                })
                .subscribe();
        }

        function debouncedLoadChatList() {
            clearTimeout(chatListRefreshTimeout);
            chatListRefreshTimeout = setTimeout(() => loadChatList(), 500);
        }

        async function loadSenderNameAndNotify(senderId, content) {
            const { data } = await supabase.from('profiles').select('username').eq('id', senderId).single();
            if (data) sendNotification(data.username, content);
        }

        async function loadMyProfile() {
            const { data } = await supabase.from('profiles').select('*').eq('id', currentUser.id).single();
            if (data) {
                currentProfile = data;
                document.getElementById('myUsername').textContent = data.username;
                document.getElementById('myPhone').textContent = '@' + data.username;
                document.getElementById('myNumber').textContent = data.phone_number || 'Belum ada';
                if (data.avatar_url) {
                    document.getElementById('myAvatar').innerHTML = '<img src="' + data.avatar_url + '" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">';
                }
            }
        }

        function setupPresence() {
            presenceChannel = supabase.channel('online-users', {
                config: { presence: { key: currentUser.id } }
            });
            presenceChannel
                .on('presence', { event: 'sync' }, () => updateAllOnlineStatus())
                .subscribe(async (status) => {
                    if (status === 'SUBSCRIBED') {
                        await presenceChannel.track({ user_id: currentUser.id, online_at: new Date().toISOString() });
                    }
                });
        }

        function updateAllOnlineStatus() {
            if (!presenceChannel) return;
            const state = presenceChannel.presenceState();
            const onlineUsers = Object.keys(state);
            document.querySelectorAll('.user-item').forEach(item => {
                const userId = item.dataset.id;
                const dot = item.querySelector('.online-dot');
                if (dot) {
                    if (onlineUsers.includes(userId)) dot.classList.add('online');
                    else dot.classList.remove('online');
                }
            });
            if (currentChatUser) {
                const dot = document.getElementById('chatOnlineDot');
                if (onlineUsers.includes(currentChatUser.id)) {
                    dot.classList.add('online');
                    document.getElementById('chatStatus').textContent = 'Online';
                } else {
                    dot.classList.remove('online');
                    document.getElementById('chatStatus').textContent = 'Offline';
                }
            }
        }

        async function loadChatList() {
            const list = document.getElementById('userList');
            const { data: messages } = await supabase
                .from('messages').select('*')
                .or(`sender_id.eq.${currentUser.id},receiver_id.eq.${currentUser.id}`)
                .order('created_at', { ascending: false });

            if (!messages || messages.length === 0) {
                list.innerHTML = '<div class="loading-small">Belum ada chat.</div>';
                return;
            }

            const userIds = new Set();
            messages.forEach(m => {
                if (m.sender_id !== currentUser.id) userIds.add(m.sender_id);
                if (m.receiver_id !== currentUser.id) userIds.add(m.receiver_id);
            });

            const { data: profiles } = await supabase.from('profiles').select('*').in('id', Array.from(userIds));
            if (!profiles || profiles.length === 0) {
                list.innerHTML = '<div class="loading-small">Belum ada chat</div>';
                return;
            }

            const presenceState = presenceChannel ? presenceChannel.presenceState() : {};
            const onlineUsers = Object.keys(presenceState);

            list.innerHTML = profiles.map(u => {
                const userMessages = messages.filter(m =>
                    (m.sender_id === u.id && m.receiver_id === currentUser.id) ||
                    (m.receiver_id === u.id && m.sender_id === currentUser.id)
                );
                const lastMsg = userMessages[0];
                const unreadCount = userMessages.filter(m => m.sender_id === u.id && m.receiver_id === currentUser.id && !m.is_read).length;
                const avatarHtml = u.avatar_url
                    ? '<img src="' + u.avatar_url + '" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">'
                    : '🌸';
                const isOnline = onlineUsers.includes(u.id);
                const badgeHtml = unreadCount > 0 ? '<div class="unread-badge">' + unreadCount + '</div>' : '';

                return '<div class="user-item" data-id="' + u.id + '" data-username="' + u.username + '" data-phone="' + (u.phone_number || '') + '" data-avatar="' + (u.avatar_url || '') + '">' +
                    '<div class="user-item-avatar">' + avatarHtml + '<span class="online-dot ' + (isOnline ? 'online' : '') + '"></span></div>' +
                    '<div style="flex:1;overflow:hidden;">' +
                        '<div class="user-item-name">' + u.username + '</div>' +
                        '<div class="user-item-status">' + (lastMsg ? truncate(lastMsg.content, 25) : 'Mulai chat') + '</div>' +
                    '</div>' + badgeHtml + '</div>';
            }).join('');

            list.querySelectorAll('.user-item').forEach(item => {
                item.addEventListener('click', () => {
                    openChat(item.dataset.id, item.dataset.username, item.dataset.phone, item.dataset.avatar);
                });
            });
        }

        function truncate(str, n) { return str.length > n ? str.substr(0, n - 1) + '...' : str; }

        async function startNewChat() {
            const phone = document.getElementById('searchNumber').value.trim();
            const error = document.getElementById('searchError');
            if (!phone || phone.length !== 12 || !phone.startsWith('08')) {
                error.textContent = 'Nomor harus 12 digit dan mulai dengan 08';
                error.classList.add('show');
                return;
            }
            if (phone === currentProfile.phone_number) {
                error.textContent = 'Itu nomor lo sendiri';
                error.classList.add('show');
                return;
            }
            const { data, error: err } = await supabase.from('profiles').select('*').eq('phone_number', phone).single();
            if (err || !data) {
                error.textContent = 'Nomor gak ditemukan';
                error.classList.add('show');
                return;
            }
            document.getElementById('newChatModal').style.display = 'none';
            document.getElementById('searchNumber').value = '';
            error.classList.remove('show');
            openChat(data.id, data.username, data.phone_number, data.avatar_url);
        }

        async function openChat(userId, username, phone, avatar) {
            currentChatUser = { id: userId, username: username, phone: phone, avatar: avatar };
            document.getElementById('emptyChat').style.display = 'none';
            document.getElementById('chatRoom').style.display = 'flex';
            document.getElementById('chatUsername').textContent = username;
            document.getElementById('chatStatus').textContent = phone || '';
            if (avatar) {
                document.getElementById('chatAvatar').innerHTML = '<img src="' + avatar + '" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">';
            } else {
                document.getElementById('chatAvatar').innerHTML = '🌸';
            }
            await loadMessages();
            await markAsRead();
            await new Promise(r => setTimeout(r, 300));
            await loadChatList();
            updateAllOnlineStatus();

            if (messagesSubscription) messagesSubscription.unsubscribe();
            messagesSubscription = supabase.channel('messages-channel-' + userId)
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, (payload) => {
                    const msg = payload.new;
                    if ((msg.sender_id === currentUser.id && msg.receiver_id === currentChatUser.id) ||
                        (msg.sender_id === currentChatUser.id && msg.receiver_id === currentUser.id)) {
                        appendMessage(msg);
                    }
                }).subscribe();

            if (typingChannel) typingChannel.unsubscribe();
            typingChannel = supabase.channel('typing-' + [currentUser.id, userId].sort().join('-'));
            typingChannel.on('broadcast', { event: 'typing' }, (payload) => {
                if (payload.payload.from === currentChatUser.id && payload.payload.to === currentUser.id) {
                    showTypingIndicator();
                }
            }).subscribe();

            if (onlineCheckInterval) clearInterval(onlineCheckInterval);
            onlineCheckInterval = setInterval(updateAllOnlineStatus, 10000);
        }

        function closeChat() {
            document.getElementById('chatRoom').style.display = 'none';
            document.getElementById('emptyChat').style.display = 'flex';
            currentChatUser = null;
            if (messagesSubscription) messagesSubscription.unsubscribe();
            if (typingChannel) typingChannel.unsubscribe();
            if (onlineCheckInterval) clearInterval(onlineCheckInterval);
            loadChatList();
        }

        function showTypingIndicator() {
            const indicator = document.getElementById('typingIndicator');
            indicator.style.display = 'flex';
            clearTimeout(indicator._timeout);
            indicator._timeout = setTimeout(() => { indicator.style.display = 'none'; }, 3000);
        }

        async function loadMessages() {
            const { data } = await supabase.from('messages').select('*')
                .or(`and(sender_id.eq.${currentUser.id},receiver_id.eq.${currentChatUser.id}),and(sender_id.eq.${currentChatUser.id},receiver_id.eq.${currentUser.id})`)
                .order('created_at', { ascending: true });
            const box = document.getElementById('messages');
            box.innerHTML = '';
            if (data) data.forEach(appendMessage);
        }

        async function markAsRead() {
            if (!currentChatUser) return;
            const { error } = await supabase.from('messages').update({ is_read: true })
                .eq('sender_id', currentChatUser.id).eq('receiver_id', currentUser.id).eq('is_read', false);
            if (error) { console.error('markAsRead error:', error); return; }
            const userItem = document.querySelector('.user-item[data-id="' + currentChatUser.id + '"]');
            if (userItem) {
                const badge = userItem.querySelector('.unread-badge');
                if (badge) badge.remove();
            }
            await loadChatList();
        }

        function appendMessage(msg) {
            const box = document.getElementById('messages');
            const isMine = msg.sender_id === currentUser.id;
            const existing = Array.from(box.querySelectorAll('.message'));
            if (existing.some(el => el.dataset.msgId === msg.id)) return;
            const div = document.createElement('div');
            div.className = 'message ' + (isMine ? 'mine' : 'theirs');
            div.dataset.msgId = msg.id;
            div.textContent = msg.content;
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        }

        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const content = input.value.trim();
            if (!content || !currentChatUser) return;
            input.value = '';
            await supabase.from('messages').insert({
                sender_id: currentUser.id, receiver_id: currentChatUser.id, content: content
            });
        }

        function sendNotification(senderName, content) {
            if ('Notification' in window && Notification.permission === 'granted') {
                if (document.hidden) {
                    new Notification('Pesan dari ' + senderName, { body: content, icon: '/yor.png' });
                }
            }
        }

        function showNotification(message) {
            const notif = document.createElement('div');
            notif.style.cssText = 'position:fixed;top:20px;right:20px;background:linear-gradient(135deg,#ff6b9d,#c44569);color:white;padding:14px 20px;border-radius:12px;font-weight:600;z-index:99999;box-shadow:0 10px 30px rgba(196,69,105,0.5);';
            notif.textContent = message;
            document.body.appendChild(notif);
            setTimeout(() => {
                notif.style.opacity = '0';
                notif.style.transition = 'opacity 0.3s';
                setTimeout(() => notif.remove(), 300);
            }, 2000);
        }
    </script>
</body>
</html>
